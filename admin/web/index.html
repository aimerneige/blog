<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>博客管理</title><link rel="stylesheet" href="/style.css"></head>
<body><header><strong>博客管理 <small>LOCAL</small></strong><nav><button id="new">新建文章</button><button id="overview">标签 / 分类</button><button id="git">Git</button><button id="previewStart">启动预览</button><button id="previewStop">停止预览</button><button id="build">构建检查</button><button id="theme">明暗主题</button></nav></header>
<main><aside><input id="search" placeholder="搜索标题、标签"><select id="category"><option value="">全部分类 / 栏目</option></select><select id="language"><option value="">全部语言</option><option>en</option><option>zh</option></select><select id="draft"><option value="">全部状态</option><option value="true">草稿</option><option value="false">已发布</option></select><select id="sort"><option value="desc">日期降序</option><option value="asc">日期升序</option></select><p id="count"></p><div id="posts"></div></aside>
<section><div id="welcome"><h1>写下新的想法</h1><p>选择文章开始编辑，或新建中英文文章。</p></div><div id="editor" hidden><div class="toolbar"><code id="filepath"></code><button id="save">保存</button><button id="move">重命名 / 移动</button><button id="delete" class="danger">删除</button></div><form id="fields"></form><details><summary>其他字段（保留原值）</summary><pre id="unknown"></pre></details><div class="toolbar"><label class="upload">上传图片<input id="upload" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/avif"></label><span>Markdown · 预览为近似效果</span></div><div class="writing"><textarea id="body" spellcheck="false" aria-label="Markdown 正文"></textarea><article id="render"></article></div></div></section></main>
<footer id="message" role="status">就绪</footer><dialog id="panel"><button id="close">关闭</button><h2 id="panelTitle"></h2><div id="panelBody"></div></dialog><script type="module" src="/app.js"></script></body></html>
